name: Backend image

# Manual: the image is large (PyTorch + ComfyUI + custom nodes). Builds from backend/ and pushes to
# ghcr.io/<owner>/kitty-open-studio:<tag>. No model weights are inside. Locally: docker buildx bake --push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: "0.1.0"
      comfyui_ref:
        description: ComfyUI tag or commit (empty = the commit pinned in backend/custom_nodes.json)
        default: ""
      node_packs:
        description: '"all" or comma-separated pack ids from backend/custom_nodes.json'
        default: all
      push:
        description: Push to GHCR (off = only check that the image builds)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Runpod's CUDA 12.8 base is ~15 GB unpacked (Kitty's own layers are small): free the runner's disk and keep
      # Docker's storage on the larger /mnt disk.
      - name: Free disk space for the CUDA base image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - name: Move Docker's storage to /mnt
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json
          sudo sh -c 'jq ". + {\"data-root\": \"/mnt/docker\"}" /etc/docker/daemon.json > /tmp/daemon.json && mv /tmp/daemon.json /etc/docker/daemon.json'
          sudo systemctl start docker
          docker info --format 'Docker root: {{.DockerRootDir}}'
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker  # build in the daemon's storage (on /mnt), no second copy in a builder container
      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kitty-open-studio" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/Dockerfile
          push: ${{ inputs.push }}
          # One plain linux/amd64 manifest (no attestation index) is what Runpod pulls most reliably.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            COMFYUI_REF=${{ inputs.comfyui_ref }}
            NODE_PACKS=${{ inputs.node_packs }}
      - name: Image size
        run: docker image ls "${{ steps.name.outputs.image }}"
